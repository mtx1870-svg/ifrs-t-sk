      const parseCleanAmount = (val) => {
        if (val === null || val === undefined || val === "") return 0;
        if (typeof val === "number") return Number.isFinite(val) ? val : 0;

        const original = String(val).trim();
        const isNegative = /^\(.*\)$/.test(original) || original.startsWith("-");
        let normalized = original
          .trim()
          .replace(/[\s\u00A0\u202F€]/g, "")
          .replace(/[^0-9,.-]/g, "")
          .replace(/-/g, "");

        const comma = normalized.lastIndexOf(",");
        const dot = normalized.lastIndexOf(".");
        if (comma >= 0 && dot >= 0) {
          const decimalSeparator = comma > dot ? "," : ".";
          const thousandsSeparator = decimalSeparator === "," ? /\./g : /,/g;
          normalized = normalized.replace(thousandsSeparator, "");
          if (decimalSeparator === ",") normalized = normalized.replace(",", ".");
        } else if (comma >= 0 || dot >= 0) {
          const separator = comma >= 0 ? "," : ".";
          const parts = normalized.split(separator);
          const looksLikeThousands =
            parts.length > 1 &&
            parts[0] !== "0" &&
            parts.slice(1).every(part => part.length === 3);

          if (looksLikeThousands) {
            normalized = parts.join("");
          } else {
            const decimalPart = parts.pop();
            normalized = parts.join("") + "." + decimalPart;
          }
        }

        const num = Number(normalized);
        if (!Number.isFinite(num)) return 0;
        const signed = isNegative ? -num : num;
        return Math.round(signed * 100) / 100;
      };

      const formatAmountForInput = (val) => {
        const parsed = parseCleanAmount(val);

        return parsed

          .replace(/[\u00A0\u202F]/g, " ");

        });

        initializeAuth();

          isMounted = false;

        };

            throw new Error("Tento účet nemá oprávnenie vyučujúceho.");
          }
          setIsTeacher(true);
          setAuthUserId(data.user.id);
          setShowLoginModal(false);
          setTeacherPassword("");
        } catch (error) {
          console.error("Prihlásenie vyučujúceho zlyhalo:", error);
          setLoginError("Prihlásenie zlyhalo. Skontrolujte heslo.");
        } finally {
          setIsAuthenticating(false);
        }
      };

      const handleLogout = async () => {
        setAuthReady(false);
        setIsTeacher(false);
        setAuthUserId("");
        try {
          await supabase.auth.signOut();
          const { data, error } = await supabase.auth.signInAnonymously();
          if (error) throw error;
          setAuthUserId(data.user?.id || "");
        } catch (error) {
          console.error("Odhlásenie zlyhalo:", error);
          setDataLoadError("Nepodarilo sa obnoviť študentskú reláciu. Obnovte stránku.");
        } finally {
          setAuthReady(true);
        }
      };

      const publishCasePrompt = async (caseItem, index) => {
        setIsChangingCase(true);
        setCaseImportError("");
        try {
          const promptRecord = {
            id: `case_prompt_${year}`,
            year,
            student_name: "__CASE_PROMPT__",
            debit_account: "",
            credit_account: "",
            amount: parseCleanAmount(caseItem?.amount) || 0,
            description: caseItem?.text || "",
            timestamp: new Date().toISOString(),
            status: "case_prompt",
            case_number: caseItem?.order ?? null,
            owner_id: authUserId || null
          };
          const { error } = await supabase
            .from("proposals")
            .upsert([promptRecord], { onConflict: "id" });
          if (error) throw error;
          setCurrentImportedCaseIndex(index);
          await loadSupabaseData();
          return true;
        } catch (error) {
          console.error("Účtovný prípad sa nepodarilo zverejniť:", error);
          setCaseImportError(`Účtovný prípad sa nepodarilo zverejniť: ${error.message || "neznáma chyba"}`);
          return false;
        } finally {
          setIsChangingCase(false);
        }
      };

      const handleImportCasesFile = async (event) => {
        const file = event.target.files?.[0];
        event.target.value = "";
        if (!file) return;

        setCaseImportError("");
        try {
          const workbook = XLSX.read(await file.arrayBuffer(), { type: "array" });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          // raw:true zachová číselnú hodnotu bunky (napr. 60 000 ako 60000),
          // nezávisle na lokalizovanom formáte zobrazenia v Exceli.
          const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: true, defval: "" });
          const parsedCases = rows
            .map((row, sourceIndex) => ({
              order: Number(String(row[0] ?? "").trim()),
              text: String(row[1] ?? "").trim(),
              amount: parseCleanAmount(row[2]),
              sourceIndex
            }))
            .filter(item => Number.isFinite(item.order) && item.order > 0 && item.text)
            .sort((a, b) => a.order - b.order)
            .map(({ order, text, amount }) => ({ order, text, amount }));

          if (parsedCases.length === 0) {
            throw new Error("Súbor neobsahuje platné riadky. Stĺpec A musí obsahovať poradové číslo a stĺpec B text účtovného prípadu. Suma v stĺpci C je voliteľná.");
          }
          if (new Set(parsedCases.map(item => item.order)).size !== parsedCases.length) {
            throw new Error("Poradové čísla v stĺpci A sa nesmú opakovať.");
          }

          setImportedCases(parsedCases);
          localStorage.setItem(`ifrs_cases_${year}`, JSON.stringify(parsedCases));
          await publishCasePrompt(parsedCases[0], 0);
        } catch (error) {
          console.error("Import účtovných prípadov zlyhal:", error);
          setCaseImportError(error.message || "Súbor sa nepodarilo načítať.");
        }
      };

      const handleShowNextCase = async () => {
        if (pendingList.some(item => item.year === year)) {
          setCaseImportError("Najprv schváľte alebo zamietnite čakajúce návrhy k aktuálnemu účtovnému prípadu.");
          return;
        }
        const nextIndex = currentImportedCaseIndex + 1;
        if (nextIndex < 0 || nextIndex >= importedCases.length) return;
        await publishCasePrompt(importedCases[nextIndex], nextIndex);
      };

      const handleBlankAssignment = async () => {
        await publishCasePrompt(null, -1);
      };

      const handleSubmitProposal = async (e) => {
        e.preventDefault();
        const parsedAmount = parseCleanAmount(amount);
        if (!parsedAmount || parsedAmount <= 0) {
          alert("Zadajte platnú kladnú sumu.");
          return;
        }
        if (!debitAccount || !creditAccount) {
          alert("Vyberte účet na strane MD aj D.");
          return;
        }
        if (debitAccount === creditAccount) {
          alert("Účty na strane MD a D nemôžu byť rovnaké.");
          return;
        }

        setIsSending(true);
        const newRecord = {
          id: String(Date.now() + Math.floor(Math.random() * 1000)),
          year,
          student_name: studentName.trim() || "Študent",
          debit_account: debitAccount,
          credit_account: creditAccount,
          amount: parsedAmount,
          description: description.trim() || `Účtovný prípad`,
          timestamp: new Date().toLocaleTimeString(),
          status: 'pending',
          // Číslo zveřejněného případu sváže i opakované pokusy téhož studenta
          // s jedním hodnoceným účetním případem.
          case_number: currentCasePrompt?.case_number ?? null,

          setTimeout(() => setShowSuccessToast(false), 4000);

      };

      const handleApprove = async (proposal) => {
        const approvedCount = allRecords.filter(r => r.year === proposal.year && r.status === 'approved').length;
        await supabase.from('proposals').update({
          status: 'approved',

      const handleReject = async (id) => {

      const handleResetYearData = async () => {
        const confirmReset = window.confirm(
          `Chcete vynulovať T-účty a výkazy za rok ${year} a zadať novú úlohu?\n\n(Aktivita študentov zostane bezpečne zachovaná v archíve pre súhrnný Excel na konci hodiny).`

      const handleDeleteAllStudentsActivity = async () => {
        const confirmation = window.prompt(
          `Naozaj chcete natrvalo vymazať celú históriu a aktivitu všetkých študentov?\n\nTúto akciu nemožno vrátiť späť. Ak súhlasíte, napíšte do poľa nižšie slovo: VYMAZAŤ`
        );
        if (confirmation !== "VYMAZAŤ") {
          alert("Akcia bola zrušená. Údaje zostali zachované.");

        }

        const { error } = await supabase.from('proposals').delete().neq('id', '0');
        if (error) {
          alert("Chyba pri vymazávaní: " + error.message);
        } else {
          loadSupabaseData();
          setSelectedStudentFilter("ALL");
          alert("Celá história návrhov a aktivity študentov bola úspešne vymazaná.");
        }
      };

      const handleDeleteSingleStudent = async (studentNameTarget) => {
        const confirmDelete = window.confirm(
          `Naozaj chcete vymazať všetky záznamy a aktivitu študenta: "${studentNameTarget}"?`
        );
        if (!confirmDelete) return;

        const { error } = await supabase.from('proposals').delete().eq('student_name', studentNameTarget);
        if (error) {
          alert("Chyba pri vymazávaní studenta: " + error.message);
        } else {
          loadSupabaseData();
          if (selectedStudentFilter === studentNameTarget) {
            setSelectedStudentFilter("ALL");
          }
          alert(`Aktivita študenta "${studentNameTarget}" bola vymazaná.`);
        }
      };

      const pendingList = useMemo(() => allRecords.filter(r => r.status === 'pending'), [allRecords]);
      const yearPosition = YEAR_ORDER.indexOf(year);
      const previousYear = yearPosition > 0 ? YEAR_ORDER[yearPosition - 1] : null;
      const earlierYear = yearPosition > 1 ? YEAR_ORDER[yearPosition - 2] : null;
      const allApprovedEntries = useMemo(() => {
        return allRecords
          .filter(r => r.status === 'approved' && YEAR_ORDER.includes(r.year))
          .sort((a, b) => {
            const yearDiff = YEAR_ORDER.indexOf(a.year) - YEAR_ORDER.indexOf(b.year);
            return yearDiff || (a.case_number || 0) - (b.case_number || 0);
          });
      }, [allRecords]);
      const approvedEntries = useMemo(
        () => allApprovedEntries.filter(r => r.year === year),
        [allApprovedEntries, year]
      );
      const previousApprovedEntries = useMemo(
        () => previousYear ? allApprovedEntries.filter(r => r.year === previousYear) : [],
        [allApprovedEntries, previousYear]
      );
      const cumulativeApprovedEntries = useMemo(
        () => allApprovedEntries.filter(r => YEAR_ORDER.indexOf(r.year) <= yearPosition),
        [allApprovedEntries, yearPosition]
      );
      const previousCumulativeEntries = useMemo(
        () => previousYear
          ? allApprovedEntries.filter(r => YEAR_ORDER.indexOf(r.year) <= YEAR_ORDER.indexOf(previousYear))
          : [],
        [allApprovedEntries, previousYear]
      );
      const earlierCumulativeEntries = useMemo(
        () => earlierYear
          ? allApprovedEntries.filter(r => YEAR_ORDER.indexOf(r.year) <= YEAR_ORDER.indexOf(earlierYear))
          : [],
        [allApprovedEntries, earlierYear]
      );

      const resolveAccountName = (accountName) => ACCOUNT_NAME_ALIASES[accountName] || accountName;
      const getAccountDefinition = (accountName) => ACCOUNTS_DB.find(account => account.name === resolveAccountName(accountName));
      const isProfitOrLossAccount = (account) => account && (account.cat === "Náklady" || account.cat === "Výnosy");
      const isPriorPeriodAdjustmentEntry = (entry) => {
        const text = normalizeAccountText(entry.description);
        const mentionsCorrection = text.includes("oprava") && text.includes("chyb");
        const mentionsPolicyChange = text.includes("zmena") && text.includes("uctovn") && text.includes("politik");
        const debit = getAccountDefinition(entry.debit_account);
        const credit = getAccountDefinition(entry.credit_account);
        return (mentionsCorrection || mentionsPolicyChange) && (isProfitOrLossAccount(debit) || isProfitOrLossAccount(credit));
      };
      const getPriorPeriodAdjustmentImpact = (entry) => {
        const amount = parseCleanAmount(entry.amount);
        const debit = getAccountDefinition(entry.debit_account);
        const credit = getAccountDefinition(entry.credit_account);
        if (debit?.repCode === "P05") return -amount;
        if (credit?.repCode === "P05") return amount;
        let impact = 0;
        if (isProfitOrLossAccount(debit)) impact -= amount;
        if (isProfitOrLossAccount(credit)) impact += amount;
        return impact;
      };
      const getPriorPeriodBalanceReclassification = (entry) => {
        const debit = getAccountDefinition(entry.debit_account);
        const credit = getAccountDefinition(entry.credit_account);
        return debit?.repCode === "P05" || credit?.repCode === "P05"
          ? 0
          : getPriorPeriodAdjustmentImpact(entry);
      };
      const sumEntryValues = (entries, valueGetter) => entries.reduce((sum, entry) => sum + valueGetter(entry), 0);

      const priorPeriodAdjustmentEntries = useMemo(
        () => approvedEntries.filter(isPriorPeriodAdjustmentEntry),
        [approvedEntries]
      );
      const previousPriorPeriodAdjustmentEntries = useMemo(
        () => previousApprovedEntries.filter(isPriorPeriodAdjustmentEntry),
        [previousApprovedEntries]
      );
      const cumulativePriorPeriodAdjustmentEntries = useMemo(
        () => cumulativeApprovedEntries.filter(isPriorPeriodAdjustmentEntry),
        [cumulativeApprovedEntries]
      );
      const previousCumulativePriorPeriodAdjustmentEntries = useMemo(
        () => previousCumulativeEntries.filter(isPriorPeriodAdjustmentEntry),
        [previousCumulativeEntries]
      );
      const earlierCumulativePriorPeriodAdjustmentEntries = useMemo(
        () => earlierCumulativeEntries.filter(isPriorPeriodAdjustmentEntry),
        [earlierCumulativeEntries]
      );

      const currentPriorPeriodAdjustmentImpact = sumEntryValues(priorPeriodAdjustmentEntries, getPriorPeriodAdjustmentImpact);
      const previousPriorPeriodAdjustmentImpact = sumEntryValues(previousPriorPeriodAdjustmentEntries, getPriorPeriodAdjustmentImpact);
      const cumulativePriorPeriodBalanceReclassification = sumEntryValues(cumulativePriorPeriodAdjustmentEntries, getPriorPeriodBalanceReclassification);
      const previousCumulativePriorPeriodBalanceReclassification = sumEntryValues(previousCumulativePriorPeriodAdjustmentEntries, getPriorPeriodBalanceReclassification);
      const earlierCumulativePriorPeriodBalanceReclassification = sumEntryValues(earlierCumulativePriorPeriodAdjustmentEntries, getPriorPeriodBalanceReclassification);

      const consensus = useMemo(() => {
        const yearPending = pendingList.filter(p => p.year === year);
        if (yearPending.length === 0) return null;

        const countValues = (arr, key) => {
          const map = {};
          arr.forEach(item => {
            const val = item[key];
            map[val] = (map[val] || 0) + 1;
          });
          let maxVal = null;
          let maxCount = 0;
          for (const k in map) {
            if (map[k] > maxCount) {
              maxCount = map[k];
              maxVal = k;
            }
          }
          return { value: maxVal, count: maxCount, percent: Math.round((maxCount / arr.length) * 100) };
        };

        const topMD = countValues(yearPending, 'debit_account');
        const topD = countValues(yearPending, 'credit_account');
        const topAmount = countValues(yearPending, 'amount');
        const avgAmount = Math.round(
          yearPending.reduce((sum, p) => sum + parseCleanAmount(p.amount), 0) / yearPending.length
        );

        return {
          total: yearPending.length,
          topMD,
          topD,
          topAmount,
          avgAmount,
          desc: yearPending[0]?.description || `Účtovný prípad`
        };
      }, [pendingList, year]);

      const openConsensusEdit = () => {
        if (!consensus) return;
        setEditMD(consensus.topMD.value);
        setEditD(consensus.topD.value);
        setEditAmount(consensus.topAmount.value);
        setEditDescription(consensus.desc);
        setEditConsensusModal(true);
      };

      const handleApproveConsensus = async (customValues = null) => {
        if (!consensus) return;
        const nextNum = approvedEntries.length + 1;
        const activeCaseNumber = currentCasePrompt?.case_number ?? nextNum;
        const finalMD = customValues ? customValues.md : consensus.topMD.value;
        const finalD = customValues ? customValues.d : consensus.topD.value;
        const finalAmt = parseCleanAmount(customValues ? customValues.amount : consensus.topAmount.value);
        const finalDesc = customValues ? customValues.desc : consensus.desc;

        const consensusRecord = {
          id: String(Date.now()),
          year,
          student_name: customValues ? `Konsenzus (upravený vyučujúcim)` : `Konsenzus (${consensus.total} študentov)`,
          debit_account: finalMD,
          credit_account: finalD,
          amount: finalAmt,
          description: finalDesc,
          timestamp: new Date().toLocaleTimeString(),
          status: 'approved',
          case_number: activeCaseNumber,
          owner_id: authUserId || null
        };

        await supabase.from('proposals').insert([consensusRecord]);

        const currentPending = pendingList.filter(p => p.year === year);
        for (const prop of currentPending) {
          const studentAmt = parseCleanAmount(prop.amount);
          const isAmountMatch = Math.abs(studentAmt - finalAmt) <= 1.0001;
          const isAccountMatch = (prop.debit_account === finalMD && prop.credit_account === finalD);
          const isCorrect = isAccountMatch && isAmountMatch;

          await supabase.from('proposals').update({
            status: isCorrect ? 'consensus_match' : 'archived',
            case_number: activeCaseNumber
          }).eq('id', prop.id);
        }

        setEditConsensusModal(false);
        loadSupabaseData();
      };

      const buildAccountsLedger = (entries) => {
        const ledger = {};
        ACCOUNTS_DB.forEach(acc => {
          ledger[acc.name] = {
            ...acc,
            debitRows: [],
            creditRows: [],
            totalDebit: 0,
            totalCredit: 0,
            balance: 0
          };
        });

        entries.forEach(entry => {
          const amt = parseCleanAmount(entry.amount);
          const debitAccountName = resolveAccountName(entry.debit_account);
          const creditAccountName = resolveAccountName(entry.credit_account);
          if (ledger[debitAccountName]) {
            ledger[debitAccountName].debitRows.push({ num: entry.case_number, val: amt });
            ledger[debitAccountName].totalDebit += amt;
          }
          if (ledger[creditAccountName]) {
            ledger[creditAccountName].creditRows.push({ num: entry.case_number, val: amt });
            ledger[creditAccountName].totalCredit += amt;
          }
        });

        Object.values(ledger).forEach(acc => {
          if (acc.cat === "Majetok" || acc.cat === "Náklady") {
            acc.balance = acc.totalDebit - acc.totalCredit;
          } else {
            acc.balance = acc.totalCredit - acc.totalDebit;
          }
        });

        return ledger;
      };

      const accountsLedger = useMemo(() => buildAccountsLedger(approvedEntries), [approvedEntries]);
      const previousAccountsLedger = useMemo(() => buildAccountsLedger(previousApprovedEntries), [previousApprovedEntries]);
      const cumulativeAccountsLedger = useMemo(() => buildAccountsLedger(cumulativeApprovedEntries), [cumulativeApprovedEntries]);
      const previousCumulativeLedger = useMemo(() => buildAccountsLedger(previousCumulativeEntries), [previousCumulativeEntries]);
      const earlierCumulativeLedger = useMemo(() => buildAccountsLedger(earlierCumulativeEntries), [earlierCumulativeEntries]);
      const reportingAccountsLedger = useMemo(
        () => buildAccountsLedger(approvedEntries.filter(entry => !isPriorPeriodAdjustmentEntry(entry))),
        [approvedEntries]
      );
      const previousReportingAccountsLedger = useMemo(
        () => buildAccountsLedger(previousApprovedEntries.filter(entry => !isPriorPeriodAdjustmentEntry(entry))),
        [previousApprovedEntries]
      );
      const cumulativeReportingAccountsLedger = useMemo(
        () => buildAccountsLedger(cumulativeApprovedEntries.filter(entry => !isPriorPeriodAdjustmentEntry(entry))),
        [cumulativeApprovedEntries]
      );
      const previousCumulativeReportingLedger = useMemo(
        () => buildAccountsLedger(previousCumulativeEntries.filter(entry => !isPriorPeriodAdjustmentEntry(entry))),
        [previousCumulativeEntries]
      );
      const earlierCumulativeReportingLedger = useMemo(
        () => buildAccountsLedger(earlierCumulativeEntries.filter(entry => !isPriorPeriodAdjustmentEntry(entry))),
        [earlierCumulativeEntries]
      );

      const activeTAccounts = useMemo(() => {
        return Object.values(accountsLedger).filter(
          a => a.debitRows.length > 0 || a.creditRows.length > 0
        );
      }, [accountsLedger]);

      const calculateVzazReport = (ledger) => {
        const getSumByRepCode = (code, isCreditPositive = true) => {
          let sum = 0;
          Object.values(ledger).forEach(acc => {
            if (acc.repCode === code) {
              sum += isCreditPositive ? (acc.totalCredit - acc.totalDebit) : (acc.totalDebit - acc.totalCredit);
            }
          });
          return sum;
        };

        const V01 = getSumByRepCode("V01", true);
        const V02 = getSumByRepCode("V02", true);
        const V03 = getSumByRepCode("V03", false);
        const V04 = getSumByRepCode("V04", true);
        const V05 = getSumByRepCode("V05", false);
        const V06 = getSumByRepCode("V06", false);
        const V07 = getSumByRepCode("V07", false);
        const V08 = getSumByRepCode("V08", false);
        const V09 = getSumByRepCode("V09", false);
        const V10 = getSumByRepCode("V10", false);
        const V11 = getSumByRepCode("V11", false);
        const V12 = getSumByRepCode("V12", false);
        const V13 = getSumByRepCode("V13", true);
        const V14 = getSumByRepCode("V14", true);
        const V15 = getSumByRepCode("V15", true);
        const V16 = getSumByRepCode("V16", false);

        const S1 = (V01 + V02 + V04 + V13 + V14 + V15) - (V03 + V05 + V06 + V07 + V08 + V09 + V10 + V11 + V12 + V16);

        const V17 = getSumByRepCode("V17", true);
        const V18 = getSumByRepCode("V18", false);
        const V19 = getSumByRepCode("V19", true);
        const V20 = getSumByRepCode("V20", false);
        const V21 = getSumByRepCode("V21", true);

        const S2 = S1 + (V17 + V19 + V21) - (V18 + V20);

        const V22 = getSumByRepCode("V22", false);
        const V23 = getSumByRepCode("V23", false);

        const S3 = S2 - (V22 + V23);
        const V24 = getSumByRepCode("V24", false);
        const S4 = S3 - V24;

        const O01 = getSumByRepCode("O01", true);
        const O07 = getSumByRepCode("O07", true);
        const O02 = getSumByRepCode("O02", true);
        const O03 = getSumByRepCode("O03", false);
        const S5 = (O01 + O07 + O02) - O03;

        const O04 = getSumByRepCode("O04", true);
        const O06 = getSumByRepCode("O06", true);
        const O05 = getSumByRepCode("O05", false);
        const S6 = (O04 + O06) - O05;

        const S7 = S5 + S6;
        const S8 = S4 + S7;

        return {
          V01, V02, V03, V04, V05, V06, V07, V08, V09, V10, V11, V12, V13, V14, V15, V16, S1,
          V17, V18, V19, V20, V21, S2, V22, V23, S3, V24, S4,
          O01, O07, O02, O03, S5, O04, O06, O05, S6, S7, S8
        };
      };

      const vzazReport = useMemo(() => calculateVzazReport(reportingAccountsLedger), [reportingAccountsLedger]);
      const previousVzazReport = useMemo(() => calculateVzazReport(previousReportingAccountsLedger), [previousReportingAccountsLedger]);
      const cumulativeVzazReport = useMemo(() => calculateVzazReport(cumulativeReportingAccountsLedger), [cumulativeReportingAccountsLedger]);
      const previousCumulativeVzazReport = useMemo(() => calculateVzazReport(previousCumulativeReportingLedger), [previousCumulativeReportingLedger]);
      const earlierCumulativeVzazReport = useMemo(() => calculateVzazReport(earlierCumulativeReportingLedger), [earlierCumulativeReportingLedger]);

      const calculateRozvahaReport = (ledger, resultReport, priorPeriodBalanceReclassification = 0) => {
        const getNetBalance = (code, isAsset = true) => {
          let net = 0;
          Object.values(ledger).forEach(acc => {
            if (acc.repCode === code) {
              if (isAsset) {
                net += acc.contra ? -(acc.totalCredit - acc.totalDebit) : (acc.totalDebit - acc.totalCredit);
              } else {
                net += acc.contra ? -(acc.totalDebit - acc.totalCredit) : (acc.totalCredit - acc.totalDebit);
              }
            }
          });
          return net;
        };

        const A01 = getNetBalance("A01", true);
        const A02 = getNetBalance("A02", true);
        const A03 = getNetBalance("A03", true);
        const A04 = getNetBalance("A04", true);
        const A05 = getNetBalance("A05", true);
        const A06 = getNetBalance("A06", true);
        const A07 = getNetBalance("A07", true);
        const A08 = getNetBalance("A08", true);
        const SA1 = A01 + A02 + A03 + A04 + A05 + A06 + A07 + A08;

        const A09 = getNetBalance("A09", true);
        const A10 = getNetBalance("A10", true);
        const A11 = getNetBalance("A11", true);
        const A12 = getNetBalance("A12", true);
        const A13 = getNetBalance("A13", true);
        const A14 = getNetBalance("A14", true);
        const A15 = getNetBalance("A15", true);
        const A16 = getNetBalance("A16", true);
        const SA2 = A09 + A10 + A11 + A12 + A13 + A14 + A15 + A16;

        const A17 = getNetBalance("A17", true);
        const SA3 = SA2 + A17;
        const SA4 = SA1 + SA3;

        const P01 = getNetBalance("P01", false) + getNetBalance("TR_EMIS", false);
        const P02 = getNetBalance("P02", false);
        const P23 = getNetBalance("P23", false);

        const ociPreceneni = (resultReport.O01 + resultReport.O07) - resultReport.O03;
        const P03 = getNetBalance("P03", false) + ociPreceneni;

        const ociOstatni = (resultReport.O04 + resultReport.O06) - resultReport.O05;
        const P04 = getNetBalance("P04", false) + ociOstatni;

        const ociPozitky = resultReport.O02;
        const P05 = getNetBalance("P05", false) + getNetBalance("TR_DIV", false) + resultReport.S4 + ociPozitky + priorPeriodBalanceReclassification;

        const SP1 = P01 + P02 - P23 + P03 + P04 + P05;

        const P06 = getNetBalance("P06", false);
        const P07 = getNetBalance("P07", false);
        const P08 = getNetBalance("P08", false);
        const P09 = getNetBalance("P09", false);
        const P10 = getNetBalance("P10", false);
        const P11 = getNetBalance("P11", false);
        const SP2 = P06 + P07 + P08 + P09 + P10 + P11;

        const P12 = getNetBalance("P12", false);
        const P13 = getNetBalance("P13", false);
        const P14 = getNetBalance("P14", false);
        const P15 = getNetBalance("P15", false);
        const P16 = getNetBalance("P16", false);
        const P17 = getNetBalance("P17", false);
        const P18 = getNetBalance("P18", false);
        const P19 = getNetBalance("P19", false);
        const P20 = getNetBalance("P20", false);
        const P21 = getNetBalance("P21", false);
        const P22 = getNetBalance("P22", false);
        const SP3 = P12 + P13 + P14 + P15 + P16 + P17 + P18 + P19 + P20 + P21 + P22;

        const PASIVA_CELKEM = SP1 + SP2 + SP3;
        const ROVNOVAHA = Math.abs(SA4 - PASIVA_CELKEM) < 0.001;

        return {
          A01, A02, A03, A04, A05, A06, A07, A08, SA1,
          A09, A10, A11, A12, A13, A14, A15, A16, SA2, A17, SA3, SA4,
          P01, P02, P23, P03, P04, P05, SP1,
          P06, P07, P08, P09, P10, P11, SP2,
          P12, P13, P14, P15, P16, P17, P18, P19, P20, P21, P22, SP3,
          PASIVA_CELKEM, ROVNOVAHA
        };
      };

      const rozvahaReport = useMemo(
        () => calculateRozvahaReport(cumulativeAccountsLedger, cumulativeVzazReport, cumulativePriorPeriodBalanceReclassification),
        [cumulativeAccountsLedger, cumulativeVzazReport, cumulativePriorPeriodBalanceReclassification]
      );
      const previousRozvahaReport = useMemo(
        () => previousYear
          ? calculateRozvahaReport(previousCumulativeLedger, previousCumulativeVzazReport, previousCumulativePriorPeriodBalanceReclassification)
          : null,
        [previousYear, previousCumulativeLedger, previousCumulativeVzazReport, previousCumulativePriorPeriodBalanceReclassification]
      );
      const earlierRozvahaReport = useMemo(
        () => earlierYear
          ? calculateRozvahaReport(earlierCumulativeLedger, earlierCumulativeVzazReport, earlierCumulativePriorPeriodBalanceReclassification)
          : null,
        [earlierYear, earlierCumulativeLedger, earlierCumulativeVzazReport, earlierCumulativePriorPeriodBalanceReclassification]
      );

      const getOwnerTransactionEffects = (entries) => {
        let capitalContribution = 0;
        let dividendEntitlement = 0;
        entries.forEach(entry => {
          const text = normalizeAccountText(entry.description);
          const amount = parseCleanAmount(entry.amount);
          const debit = getAccountDefinition(entry.debit_account);
          const credit = getAccountDefinition(entry.credit_account);
          const mentionsContribution = text.includes("vklad") && text.includes("zaklad") && (text.includes("iman") || text.includes("kapital"));
          const mentionsDividend = text.includes("narok") && text.includes("dividend");
          const capitalAccountImpact =
            (credit?.repCode === "P01" || credit?.repCode === "TR_EMIS" ? amount : 0) -
            (debit?.repCode === "P01" || debit?.repCode === "TR_EMIS" ? amount : 0);
          const retainedEarningsImpact =
            (credit?.repCode === "P05" || credit?.repCode === "TR_DIV" ? amount : 0) -
            (debit?.repCode === "P05" || debit?.repCode === "TR_DIV" ? amount : 0);

          if (mentionsContribution) capitalContribution += capitalAccountImpact || amount;
          else if (debit?.repCode === "TR_EMIS" || credit?.repCode === "TR_EMIS") capitalContribution += capitalAccountImpact;

          if (mentionsDividend) dividendEntitlement += retainedEarningsImpact || -amount;
          else if (debit?.repCode === "TR_DIV" || credit?.repCode === "TR_DIV") dividendEntitlement += retainedEarningsImpact;
        });
        return { capitalContribution, dividendEntitlement };
      };

      const calculateZmenyVKReport = (periodEntries, periodResult, closingBalance, openingBalance, priorPeriodAdjustmentImpact) => {
        const vh = periodResult.S4;
        const ociPreceneni = (periodResult.O01 + periodResult.O07) - periodResult.O03;
        const ociOstatni = (periodResult.O04 + periodResult.O06) - periodResult.O05;
        const ociPozitky = periodResult.O02;
        const ociTotal = periodResult.S7;

        const ownerTransactions = getOwnerTransactionEffects(periodEntries);

        const init = openingBalance
          ? {
              zk: openingBalance.P01,
              ea: openingBalance.P02,
              va: -Math.abs(openingBalance.P23),
              fp: openingBalance.P03,
              of: openingBalance.P04,
              nz: openingBalance.P05
            }
          : { zk: 0, ea: 0, va: 0, fp: 0, of: 0, nz: 0 };
        const rowOpravy = {
          zk: 0, ea: 0, va: 0, fp: 0, of: 0,
          nz: priorPeriodAdjustmentImpact,
          total: priorPeriodAdjustmentImpact
        };
        const initPoUpravach = {
          ...init,
          nz: init.nz + priorPeriodAdjustmentImpact,
          total: init.zk + init.ea + init.va + init.fp + init.of + init.nz + priorPeriodAdjustmentImpact
        };
        const rowVH = { zk: 0, ea: 0, va: 0, fp: 0, of: 0, nz: vh, total: vh };
        const rowOUV = { zk: 0, ea: 0, va: 0, fp: ociPreceneni, of: ociOstatni, nz: ociPozitky, total: ociTotal };
        const rowTotalResult = {
          zk: 0, ea: 0, va: 0,
          fp: ociPreceneni, of: ociOstatni, nz: vh + ociPozitky,
          total: vh + ociTotal
        };

        const rowTransakce = {
          zk: ownerTransactions.capitalContribution, ea: 0, va: 0, fp: 0, of: 0,
          nz: ownerTransactions.dividendEntitlement,
          total: ownerTransactions.capitalContribution + ownerTransactions.dividendEntitlement
        };

        const rowEnd = {
          zk: closingBalance.P01,
          ea: closingBalance.P02,
          va: -Math.abs(closingBalance.P23),
          fp: closingBalance.P03,
          of: closingBalance.P04,
          nz: closingBalance.P05,
          total: closingBalance.SP1
        };

        const componentTotal = rowEnd.zk + rowEnd.ea + rowEnd.va + rowEnd.fp + rowEnd.of + rowEnd.nz;
        const kontrolaVK = Math.abs(componentTotal - closingBalance.SP1) < 0.001;

        return { init, rowOpravy, initPoUpravach, rowVH, rowOUV, rowTotalResult, rowTransakce, rowEnd, kontrolaVK };
      };

      const zmenyVKReport = useMemo(

      const studentsStats = useMemo(() => {
        const statsMap = {};
        allRecords.forEach(rec => {
          if (rec.status === "case_prompt" || rec.student_name === "__CASE_PROMPT__") return;
          const name = rec.student_name ? rec.student_name.trim() : "Anonymní";
          if (name.startsWith("Konsenzus") || name.startsWith("Väčšina")) return;

          if (!statsMap[name]) {
            statsMap[name] = {
              name,
              totalProposals: 0,
              approvedCount: 0,
              directApproved: 0,
              consensusMatches: 0,
              rejectedCount: 0,
              pendingCount: 0,
              archivedCount: 0,
              lastActive: rec.timestamp || "",
              records: [],
              cases: {}
            };
          }

          statsMap[name].totalProposals += 1;
          if (rec.status === 'approved') {
            statsMap[name].approvedCount += 1;
            statsMap[name].directApproved += 1;
          } else if (rec.status === 'consensus_match') {
            statsMap[name].approvedCount += 1;
            statsMap[name].consensusMatches += 1;
          } else if (rec.status === 'rejected') {
            statsMap[name].rejectedCount += 1;
          } else if (rec.status === 'pending') {
            statsMap[name].pendingCount += 1;
          } else {
            statsMap[name].archivedCount += 1;
          }

          statsMap[name].lastActive = rec.timestamp || statsMap[name].lastActive;
          statsMap[name].records.push(rec);

          // Úspešnosť se počítá za účetní případy, ne za jednotlivé pokusy.
          // Shoda s konsensem proto znamená 100 % za daný případ, i když mu
          // predcházel jiný (nesprávný) pokus.
          const caseNumber = rec.case_number;
          const descriptionKey = String(rec.description || "").trim().toLocaleLowerCase("sk-SK");
          const caseKey = caseNumber !== null && caseNumber !== undefined && caseNumber !== ""
            ? `${rec.year || ""}|${caseNumber}`
            : `${rec.year || ""}|${descriptionKey || rec.id}`;
          if (!statsMap[name].cases[caseKey]) {
            statsMap[name].cases[caseKey] = { completed: false, successful: false };
          }
          if (rec.status !== 'pending') {
            statsMap[name].cases[caseKey].completed = true;
          }
          if (rec.status === 'approved' || rec.status === 'consensus_match') {
            statsMap[name].cases[caseKey].successful = true;
          }
        });

        return Object.values(statsMap)
          .map(stats => {
            const completedCases = Object.values(stats.cases).filter(item => item.completed);
            const successfulCases = completedCases.filter(item => item.successful);
            return {
              ...stats,
              evaluatedCases: completedCases.length,
              successfulCases: successfulCases.length,
              successRate: completedCases.length
                ? Math.round((successfulCases.length / completedCases.length) * 100)
                : 0
            };
          })
          .sort((a, b) => b.totalProposals - a.totalProposals);
      }, [allRecords]);

                      <th className="p-3 text-right">Suma</th>
                      {isTeacher && <th className="p-3">Riešil</th>}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {approvedEntries.length === 0 ? (
                      <tr><td colSpan={isTeacher ? 6 : 5} className="p-6 text-center text-slate-400">Žiadne zápisy v denníku</td></tr>
                    ) : (
                      approvedEntries.map((e, idx) => (
                        <tr key={idx} className="hover:bg-slate-50">
                          <td className="p-3 font-bold text-slate-500">({e.case_number})</td>
                          <td className="p-3 font-medium text-slate-800">{e.description}</td>
                          <td className="p-3 font-semibold text-emerald-700">{resolveAccountName(e.debit_account)}</td>
                          <td className="p-3 font-semibold text-amber-700">{resolveAccountName(e.credit_account)}</td>
                          <td className="p-3 text-right font-mono font-bold">{parseFloat(e.amount).toLocaleString("sk-SK")} €</td>
                          {isTeacher && <td className="p-3 text-slate-500">{e.student_name}</td>}
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>

            </div>
          )}

          {isTeacher && activeTab === "students" && (
            <div className="space-y-6">
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                <div className="flex flex-wrap justify-between items-center gap-2 border-b pb-2">
                  <div>
                    <h3 className="font-bold text-slate-800">Súhrnná aktivita študentov za celú hodinu</h3>
                    <p className="text-xs text-slate-500">Zapojení študenti: <strong>{studentsStats.length}</strong></p>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <button
                      onClick={exportStudentsIndividualExcel}
                      className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-3 py-1.5 rounded-lg shadow transition-colors flex items-center gap-1"
                    >
                      📥 Stiahnuť tento prehľad do Excelu
                    </button>
                    <button
                      onClick={handleDeleteAllStudentsActivity}
                      className="bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs px-3 py-1.5 rounded-lg shadow transition-colors flex items-center gap-1"
                      title="Natrvalo vymaže všetky návrhy a celú históriu študentov zo Supabase"
                    >
                      🗑️ Vymazať celú históriu študentov
                    </button>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-100 text-slate-600 font-bold uppercase">
                      <tr>
                        <th className="p-2.5">Študent</th>
                        <th className="p-2.5 text-center">Návrhy spolu</th>
                        <th className="p-2.5 text-center text-emerald-700">Priamo schválené</th>
                        <th className="p-2.5 text-center text-teal-700">Správne v konsenze</th>
                        <th className="p-2.5 text-center text-rose-700">Zamietnuté</th>
                        <th className="p-2.5 text-center text-slate-500">Archív / Nesprávne</th>
                        <th className="p-2.5 text-right">Úspešnosť</th>
                        <th className="p-2.5 text-center">Akcie</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {studentsStats.length === 0 ? (
                        <tr>
                          <td colSpan="8" className="p-6 text-center text-slate-400">Zatiaľ sa nezapojil žiadny študent.</td>
                        </tr>
                      ) : (
                        studentsStats.map((s, idx) => {
                          const rate = s.successRate;
                          return (
                            <tr key={idx} className="hover:bg-slate-50">
                              <td className="p-2.5 font-bold text-slate-800">{s.name}</td>
                              <td className="p-2.5 text-center font-semibold">{s.totalProposals}</td>
                              <td className="p-2.5 text-center font-bold text-emerald-600">{s.directApproved}</td>
                              <td className="p-2.5 text-center font-bold text-teal-600">{s.consensusMatches}</td>
                              <td className="p-2.5 text-center font-bold text-rose-600">{s.rejectedCount}</td>
                              <td className="p-2.5 text-center font-medium text-slate-500">{s.archivedCount}</td>
                              <td className="p-2.5 text-right font-mono font-bold text-indigo-700">{rate} %</td>
                              <td className="p-2.5 text-center space-x-1">
                                <button
                                  onClick={() => setSelectedStudentFilter(s.name)}
                                  className="text-[11px] bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 font-bold px-2 py-1 rounded border transition-colors"
                                >
                                  Zobraziť históriu
                                </button>
                                <button
                                  onClick={() => handleDeleteSingleStudent(s.name)}
                                  className="text-[11px] bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold px-2 py-1 rounded border border-rose-200 transition-colors"
                                  title={`Vymazať iba aktivitu študenta ${s.name}`}
                                >
                                  🗑️️ Vymazať
                                </button>
                              </td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                <div className="flex flex-wrap justify-between items-center gap-3 border-b pb-2">
                  <div>
                    <h3 className="font-bold text-slate-800">
                      História návrhov: {selectedStudentFilter === "ALL" ? "Všetci študenti" : selectedStudentFilter}
                    </h3>
                  </div>

                  <div className="flex items-center gap-2 text-xs">
                    <span className="font-bold text-slate-600">Filtrovať študenta:</span>
                    <select
                      value={selectedStudentFilter}
                      onChange={e => setSelectedStudentFilter(e.target.value)}
                      className="px-2.5 py-1.5 border rounded-lg bg-slate-50 font-medium outline-none"
                    >
                      <option value="ALL">-- Všetci študenti --</option>
                      {studentsStats.map((s, i) => (
                        <option key={i} value={s.name}>{s.name} ({s.totalProposals} návrhov)</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-100 text-slate-600 font-bold uppercase">
                      <tr>
                        <th className="p-2.5">Čas / Rok</th>
                        <th className="p-2.5">Študent</th>
                        <th className="p-2.5">Opis účtovného prípadu</th>
                        <th className="p-2.5">Má dať (MD)</th>
                        <th className="p-2.5">Dal (D)</th>
                        <th className="p-2.5 text-right">Suma</th>
                        <th className="p-2.5 text-center">Stav</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredStudentRecords.length === 0 ? (
                        <tr>
                          <td colSpan="7" className="p-6 text-center text-slate-400">Žiadne návrhy na zobrazenie.</td>
                        </tr>
                      ) : (
                        filteredStudentRecords.map((r, idx) => (
                          <tr key={idx} className="hover:bg-slate-50">
                            <td className="p-2.5 text-slate-500 font-mono text-[11px]">{r.timestamp} <span className="font-bold text-indigo-600">({r.year})</span></td>
                            <td className="p-2.5 font-bold text-slate-800">{r.student_name}</td>
                            <td className="p-2.5 text-slate-700">{r.description}</td>
                            <td className="p-2.5 font-semibold text-emerald-700">{resolveAccountName(r.debit_account)}</td>
                            <td className="p-2.5 font-semibold text-amber-700">{resolveAccountName(r.credit_account)}</td>
                            <td className="p-2.5 text-right font-mono font-bold">{parseFloat(r.amount).toLocaleString("sk-SK")} €</td>
                            <td className="p-2.5 text-center">
                              {r.status === 'approved' && <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold text-[10px]">✓ Priamo schválené</span>}
                              {r.status === 'consensus_match' && <span className="bg-teal-100 text-teal-800 px-2 py-0.5 rounded-full font-bold text-[10px]">✓ Správne v konsenze</span>}
                              {r.status === 'rejected' && <span className="bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full font-bold text-[10px]">✕ Zamietnuté</span>}
                              {r.status === 'pending' && <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold text-[10px]">⏳ Čakajúce</span>}
                              {(r.status === 'archived' || r.status === 'archived_task') && <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold text-[10px]">📁 Archív / Nesprávne</span>}
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
